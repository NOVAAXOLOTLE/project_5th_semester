version: '3.8'

services:
  app:
    build: .
    image: marketplace_app:latest
    container_name: marketplace_app
    restart: unless-stopped
    volumes:
      - ./:/var/www/html:delegated         # bind project root to container (dev)
      - vendor_data:/var/www/html/vendor   # named volume to preserve vendor (avoid hide-by-bind)
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mongodb
      - DB_HOST=monguito
      - DB_PORT=27017
      - DB_DATABASE=marketplace_db
      - DB_USERNAME=
      - DB_PASSWORD=
    depends_on:
      - monguito

  nginx:
    image: nginx:stable
    container_name: marketplace_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  monguito:
    image: mongo:6
    container_name: marketplace_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
  vendor_data: